; Bare-metal thermostat for the ATmega328P, written in C++14.
;
; The control logic in lib/thermostat has no AVR headers in it, so it builds
; twice: once for the host against fakes, once for the board against registers.
; The AVR environment and its drivers arrive with the hardware bring-up; today
; this file only has to make `pio test -e native` mean something.

[platformio]
default_envs = native

; C++14, not 17: PlatformIO's bundled MinGW is g++ 5.1 and its AVR toolchain is
; avr-g++ 7.3, and 14 is the highest standard both accept. Stated explicitly
; because g++ 5.1 still defaults to gnu++98.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -Wall -Wextra
