; Bare-metal thermostat for the ATmega328P, written in C++14.
;
; Drivers are abstract interfaces (lib/temp, lib/heater, lib/hal) and the
; application (lib/control) only ever sees those interfaces, so it builds
; twice: once for the host against the mocks, once for the board against
; registers.

[platformio]
default_envs = native

; deep rather than the default chain: lib/temp reaches hal/Adc.h and chain mode
; stops before following that hop. Not deep+, which evaluates #ifdef __AVR__
; while scanning and therefore sees no includes at all in the guarded files.
[env]
lib_ldf_mode = deep

; C++14, not 17: PlatformIO's bundled MinGW is g++ 5.1 and its AVR toolchain is
; avr-g++ 7.3, and 14 is the highest standard both accept. Stated explicitly
; because g++ 5.1 still defaults to gnu++98.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -Wall -Wextra

; Target build. No framework: this is bare metal against the registers.
; Exceptions and RTTI are off because neither is affordable in 32 KB of flash.
; UNITY_INCLUDE_CONFIG_H makes Unity print through USART0 instead of Arduino
; Serial, which this project does not have.
[env:uno]
platform = atmelavr
board = uno
upload_port = COM9
test_framework = unity
test_port = COM9
test_speed = 115200
test_build_src = yes
build_flags =
    -std=gnu++14
    -Wall
    -Wextra
    -fno-exceptions
    -fno-rtti
    -DUNITY_INCLUDE_CONFIG_H
