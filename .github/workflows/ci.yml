name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run host test suites
        run: pio test -e native

  generated-table:
    name: Generated table is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The lookup table is generated, so a hand edit to it would silently
      # disagree with the script that is supposed to be its only source.
      # Regenerating and diffing is what stops that.
      - name: Regenerate the thermistor table
        run: python tools/gen_thermistor_table.py

      - name: Fail if the checked-in table differs
        run: git diff --exit-code
